name: Tests

on:
  push:
    branches: ['**']
  pull_request:

defaults:
  run:
    working-directory: mifalim-app

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mifalim-app/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: unit
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mifalim-app/package-lock.json
      - run: npm ci
      # Skip entirely (not fail) when Supabase secrets aren't configured yet — see repo docs for setup.
      - if: ${{ env.NEXT_PUBLIC_SUPABASE_URL == '' }}
        run: echo "NEXT_PUBLIC_SUPABASE_URL secret not set — skipping e2e run." && exit 0
      - if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: npm run test:e2e
      - if: ${{ !cancelled() && env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mifalim-app/playwright-report/
          retention-days: 14
